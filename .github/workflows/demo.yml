name: Demo preview

# The user asked to see the build before it is deployed. Vercel preview
# deployments sit behind the team's SSO, so this publishes the same build to
# GitHub Pages, which is public and can be opened in any browser.
# The product is deployed to Vercel. This workflow only builds the demo.

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /linc/

      - name: Add the single page fallback
        # GitHub Pages serves 404.html for anything it does not recognise,
        # so the client router keeps working on a deep link.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not on yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish the demo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/deploy-pages@v4
