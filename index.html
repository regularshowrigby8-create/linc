<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="LinkHive — a South Africa-first connection marketplace for services, qualifications, collaboration and supply. Prototype only."
    />
    <title>LinkHive — Find the right connection.</title>
    <script>
      // Set the colour mode before the first paint so the page never flashes
      // the wrong theme. The preference is stored inside the mock state.
      (function () {
        try {
          var raw = window.localStorage.getItem('linkhive.state.v1');
          var preference = raw ? JSON.parse(raw).preferences.theme : 'system';
          var dark =
            preference === 'dark' ||
            (preference !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
